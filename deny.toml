# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
# The bench is an internal tool, and its optional profilers pull in crates the
# shipped crates never use.
exclude = ["dash-spv-bench"]

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # serde_cbor is unmaintained but only used in fuzz targets
    "RUSTSEC-2021-0127",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "MITNFA",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = [
    # Hex goes through `hex-conservative` 1.x.
    { crate = "hex", reason = "use `hex-conservative` 1.x instead" },
    { crate = "hex_lit", reason = "use `hex!` from `hex-conservative` 1.x instead" },
    { crate = "hex-literal", reason = "use `hex!` from `hex-conservative` 1.x instead" },
    # rust-bitcoin crates should never desync or tear between versions
    { crate = "base58ck", deny-multiple-versions = true },
    { crate = "bip324", deny-multiple-versions = true },
    { crate = "bitcoin-bech32", deny-multiple-versions = true },
    { crate = "bitcoin-consensus-encoding", deny-multiple-versions = true },
    { crate = "bitcoin-crypto", deny-multiple-versions = true },
    { crate = "bitcoin-primitives", deny-multiple-versions = true },
    { crate = "bitcoin-units", deny-multiple-versions = true },
    { crate = "bitcoin_hashes", deny-multiple-versions = true },
    { crate = "hex-conservative", deny-multiple-versions = true },
]
skip = [
    { crate = "bitcoin-internals", reason = "rust-bitcoin's latest releases have version tear" },
    # Older releases still come in through upstream crates (`bitcoin_hashes` 0.14 via `bip39`, 0.16 via `bip324`).
    { crate = "bitcoin_hashes:<1.0.0", reason = "depended on by rust-bitcoin crates" },
    { crate = "hex-conservative:<1.0.0", reason = "depended on by rust-bitcoin crates" },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
