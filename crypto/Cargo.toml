[package]
name = "dashcore-crypto"
description = "Cryptographic primitives shared by rust-dashcore crates."
edition = "2021"
categories = ["cryptography::cryptocurrencies"]
keywords = ["crypto", "dash", "bls", "secp256k1"]
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []

bincode = [
    "dep:bincode",
    "dep:bincode_derive",
    "dashcore_hashes/bincode",
    "dash-network/bincode",
]
bls = ["dash-pkc/bls", "dash-pkc/portable", "dep:tracing"]
eddsa = ["dash-pkc/eddsa"]
rand = ["bitcoin-crypto/rand"]
serde = [
    "dep:serde",
    "bitcoin-crypto/serde",
    "dash-types/serde",
    "dashcore_hashes/serde",
    "dash-network/serde",
    "dash-pkc/serde",
]

[dependencies]
bitcoin-crypto = { workspace = true, features = ["std", "hex"] }
bincode = { workspace = true, optional = true }
bincode_derive = { workspace = true, optional = true }
dash-network = { workspace = true }
dash-pkc = { workspace = true, features = ["ecdsa", "std"] }
dash-types = { workspace = true }
delegate = "0.13"
dashcore_hashes = { workspace = true }
hex-conservative = { workspace = true }
internals = { workspace = true }
serde = { workspace = true, features = ["derive", "alloc"], optional = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
zeroize = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = [
    'cfg(bench)',
    'cfg(fuzzing)',
    'cfg(kani)',
] }

[dev-dependencies]
bincode = { workspace = true, features = ["serde"] }
serde_json = { workspace = true }
test-case = { workspace = true }
