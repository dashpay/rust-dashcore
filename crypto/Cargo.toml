[package]
name = "dashcore-crypto"
description = "Cryptographic primitives shared by rust-dashcore crates."
edition = "2021"
categories = ["cryptography::cryptocurrencies"]
keywords = ["crypto", "dash", "bls", "secp256k1"]
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []

bincode = ["dep:bincode", "dep:bincode_derive", "dashcore_hashes/bincode", "dash-network/bincode"]
bls = ["dash-pkc/bls", "dep:tracing"]
eddsa = ["dash-pkc/eddsa"]
serde = ["dep:serde", "bitcoin-crypto/serde", "dash-types/serde", "dashcore_hashes/serde", "dash-network/serde", "dash-pkc/serde", "secp256k1/serde"]

[dependencies]
base58ck = { workspace = true }
bitcoin-crypto = { workspace = true, features = ["std", "hex"] }
bincode = { workspace = true, optional = true }
bincode_derive = { workspace = true, optional = true }
dash-network = { path = "../dash-network" }
dash-pkc = { workspace = true, features = ["std"] }
dash-types = { workspace = true, features = ["codec"] }
dashcore_hashes = { path = "../hashes" }
hex-conservative = { workspace = true }
internals = { path = "../internals", package = "dashcore-private" }
secp256k1 = { workspace = true }
serde = { workspace = true, features = ["derive", "alloc"], optional = true }
thiserror = "2"
tracing = { version = "0.1", optional = true }

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(bench)', 'cfg(fuzzing)', 'cfg(kani)'] }

[dev-dependencies]
bincode = { workspace = true, features = ["serde"] }
serde_json = { version = "1.0" }
