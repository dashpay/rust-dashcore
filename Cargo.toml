[workspace]
members = ["dash", "crypto", "dash-network", "hashes", "internals", "fuzz", "rpc-client", "rpc-json", "rpc-integration-test", "key-wallet", "key-wallet-manager", "key-wallet-ffi", "dash-spv", "dash-spv-ffi", "git-state", "dash-network-seeds", "masternode-seeds-fetcher", "dash-spv-bench"]
resolver = "2"

[workspace.dependencies]
# Packages shared across crates
bincode = { package = "grovedb-bincode", version = "=2.1.0" }
bincode_derive = { package = "grovedb-bincode-derive", version = "=2.1.0" }
futures = "0.3"
rayon = "1.11"
serde = { version = "1.0.219", default-features = false }
zeroize = { version = "1.8", features = ["derive"] }

# Packages from `dashpay/base-sdk`, MUST share same version ACROSS crates
dash-num = { git = "https://github.com/dashpay/base-sdk", rev = "89828032b6be3341cafda0ce433c010a23217b39", default-features = false }
dash-params = { git = "https://github.com/dashpay/base-sdk", rev = "89828032b6be3341cafda0ce433c010a23217b39", default-features = false }
dash-pkc = { git = "https://github.com/dashpay/base-sdk", rev = "89828032b6be3341cafda0ce433c010a23217b39", default-features = false }
dash-pow = { git = "https://github.com/dashpay/base-sdk", rev = "89828032b6be3341cafda0ce433c010a23217b39", default-features = false }
dash-types = { git = "https://github.com/dashpay/base-sdk", rev = "89828032b6be3341cafda0ce433c010a23217b39", default-features = false }

# Packages from `rust-bitcoin/rust-bitcoin`, `bitcoin-crypto` uses revision due to `secp256k1`
bitcoin_hashes = { version = "0.14.101", default-features = false }
bitcoin-crypto = { git = "https://github.com/rust-bitcoin/rust-bitcoin", rev = "7ba35c7c1dd63892bfb9c9395bbd80e2ab5df516", default-features = false }
hex-conservative = { version = "1.3.0" }

[workspace.package]
authors = ["The rust-dashcore Developers"]
edition = "2024"
license = "CC0-1.0"
repository = "https://github.com/dashpay/rust-dashcore"
rust-version = "1.89.0"
version = "0.46.0"

[patch.crates-io]
dashcore_hashes = { path = "hashes" }

[profile.release]
# Default to unwinding for most crates
panic = "unwind"

[profile.release.package.dash-fuzz]
# Disable LTO and keep debuginfo for honggfuzz to avoid link GC issues
codegen-units = 16
debug = 1

[profile.dev]
# Default to unwinding for most crates

[profile.dev.package.dash-pow]
# Unoptimized X11 is slow enough to stall header sync
opt-level = 3

[profile.dev.package.dashcore_hashes]
# Debug-build siphash is ~50x slower than optimized, and BIP158 compact-filter
# matching hashes every query element against every filter — the dust-restore
# and gap-probe tests in dash-spv spend most of their wall time there.
# dashcore_hashes is a rarely-edited leaf crate, so optimizing it in dev
# costs one slightly longer cold build and speeds every filter/hash-heavy
# test severalfold.
opt-level = 2

[profile.test.package.dashcore]
# BIP158 Golomb-Rice decoding and matching live here. Unoptimized, a dashd_sync
# restore whose gap probe matches ~1,400 derived scripts against every scanned
# filter batch takes over a minute; optimized it takes about three seconds.
# Test profile only: dashcore is edited often, so plain dev builds stay fast
# and debuggable.
opt-level = 2
