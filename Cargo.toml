[workspace]
members = ["dash", "dash-network", "hashes", "internals", "fuzz", "rpc-client", "rpc-json", "rpc-integration-test", "key-wallet", "key-wallet-manager", "key-wallet-ffi", "dash-spv", "dash-spv-ffi", "git-state", "dash-network-seeds", "masternode-seeds-fetcher", "dash-spv-bench"]
resolver = "2"

[workspace.package]
version = "0.45.0"

[patch.crates-io]
dashcore_hashes = { path = "hashes" }
# Use directly from GitHub while we don't have ownership of the crate on crates.io
rs-x11-hash = { git = "https://github.com/dashpay/rs-x11-hash", tag = "0.1.9" }

[profile.release]
# Default to unwinding for most crates
panic = "unwind"

[profile.release.package.dash-fuzz]
# Disable LTO and keep debuginfo for honggfuzz to avoid link GC issues
codegen-units = 16
debug = 1

[profile.dev]
# Default to unwinding for most crates

[profile.dev.package.dashcore_hashes]
# Debug-build siphash is ~50x slower than optimized, and BIP158 compact-filter
# matching hashes every query element against every filter — the dust-restore
# and gap-probe tests in dash-spv spend most of their wall time there.
# dashcore_hashes is a rarely-edited leaf crate, so optimizing it in dev
# costs one slightly longer cold build and speeds every filter/hash-heavy
# test severalfold.
opt-level = 2
