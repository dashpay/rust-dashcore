[workspace]
members = [
    "dash",
    "crypto",
    "dash-network",
    "hashes",
    "internals",
    "fuzz",
    "rpc-client",
    "rpc-json",
    "rpc-integration-test",
    "key-wallet",
    "key-wallet-manager",
    "dash-spv",
    "git-state",
    "dash-network-seeds",
    "masternode-seeds-fetcher",
    "dash-spv-bench",
]
resolver = "3"

[workspace.dependencies]
# Crates of this workspace
dash-network = { path = "dash-network" }
dash-network-seeds = { path = "dash-network-seeds" }
dash-spv = { path = "dash-spv" }
dashcore = { path = "dash" }
dashcore-crypto = { path = "crypto" }
dashcore-rpc = { path = "rpc-client" }
dashcore-rpc-json = { path = "rpc-json" }
dashcore_hashes = { path = "hashes" }
git-state = { path = "git-state" }
internals = { path = "internals", package = "dashcore-private" }
key-wallet = { path = "key-wallet" }
key-wallet-manager = { path = "key-wallet-manager" }

# Packages shared across crates
bincode = { package = "grovedb-bincode", version = "=2.1.0" }
bincode_derive = { package = "grovedb-bincode-derive", version = "=2.1.0" }
futures = "0.3"
rayon = "1.11"
serde = { version = "1.0.219", default-features = false }
zeroize = { version = "1.8", features = ["derive"] }
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4.20", default-features = false }
clap = { version = "4.0", features = ["derive", "env"] }
criterion = "0.8.1"
rand = "0.9"
serde_json = "1.0.140"
serde_test = "1.0.177"
tempfile = "3.0"
test-case = "3.4"
thiserror = "2"
tokio = "1.32"
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
tracing-subscriber = "0.3.20"

# Packages from `dashpay/base-sdk`
dash-num = { version = "0.3.0-beta", default-features = false }
dash-params = { version = "0.1.0-beta", default-features = false }
dash-pkc = { version = "0.3.0-beta", default-features = false }
dash-pow = { version = "0.1.1-beta", default-features = false }
dash-types = { version = "0.3.0-beta", default-features = false }

# Packages from `rust-bitcoin/rust-bitcoin`, `bitcoin-crypto` uses revision due to `secp256k1`.
# `bitcoin_hashes` follows the same revision so its hash types unify with the ones these crates use.
base58ck = { version = "0.5.0" }
bip324 = "0.11.1"
bitcoin-crypto = { git = "https://github.com/rust-bitcoin/rust-bitcoin", rev = "7ba35c7c1dd63892bfb9c9395bbd80e2ab5df516", default-features = false }
bitcoin_hashes = { git = "https://github.com/rust-bitcoin/rust-bitcoin", rev = "7ba35c7c1dd63892bfb9c9395bbd80e2ab5df516", default-features = false }
bitcoin-units = { git = "https://github.com/rust-bitcoin/rust-bitcoin", rev = "7ba35c7c1dd63892bfb9c9395bbd80e2ab5df516", default-features = false }
hex-conservative = { version = "1.3.0" }

[workspace.lints.rust]
unnameable_types = "deny"
unexpected_cfgs = { level = "deny", check-cfg = [
    'cfg(bench)',
    'cfg(fuzzing)',
    'cfg(kani)',
] }

[workspace.package]
authors = ["The rust-dashcore Developers"]
edition = "2024"
license = "CC0-1.0"
repository = "https://github.com/dashpay/rust-dashcore"
rust-version = "1.89.0"
version = "0.46.0"

[patch.crates-io]
dashcore_hashes = { path = "hashes" }

[profile.release.package.dash-fuzz]
# Disable LTO and keep debuginfo for honggfuzz to avoid link GC issues
codegen-units = 16
debug = 1

[profile.dev.package.dash-pow]
# Unoptimized X11 is slow enough to stall header sync
opt-level = 3
