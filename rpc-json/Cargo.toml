[package]
name = "dashcore-rpc-json"
authors = [
    "Steven Roose <steven@stevenroose.org>",
    "Jean Pierre Dudey <jeandudey@hotmail.com>",
    "Dawid Ciężarkiewicz <dpc@dpc.pw>"
]
description = "JSON-enabled type structs for dashcore-rpc crate."
keywords = [ "crypto", "dash", "dashcore", "rpc" ]
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "dashcore_rpc_json"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { version="1.0", features=["preserve_order"] }
serde_with = "2.1.0"
serde_repr = "0.1"
hex-conservative = { workspace = true }

key-wallet = { path = "../key-wallet", default-features = false, features=["serde", "getrandom"] }
dashcore = { path = "../dash", features=["secp-recovery", "rand-std", "signer", "serde"] }

bincode = { workspace = true, features = ["serde"] }
