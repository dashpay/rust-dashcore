codecov:
  notify:
    after_n_builds: 1

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: 0%

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: true
  show_carryforward_flags: true

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: dashcore
      paths:
        - dash/src/
    - name: dashcore-crypto
      paths:
        - crypto/src/
    - name: dashcore_hashes
      paths:
        - hashes/src/
    - name: dashcore-private
      paths:
        - internals/src/
    - name: dash-network
      paths:
        - dash-network/src/
    - name: dash-network-seeds
      paths:
        - dash-network-seeds/src/
    - name: key-wallet
      paths:
        - key-wallet/src/
    - name: key-wallet-manager
      paths:
        - key-wallet-manager/src/
    - name: dashcore-rpc
      paths:
        - rpc-client/src/
    - name: dashcore-rpc-json
      paths:
        - rpc-json/src/
    - name: dash-spv
      paths:
        - dash-spv/src/

ignore:
  - "**/tests/**"
  - "**/tests.rs"
  - "**/test_utils/**"
  - "**/test_utils.rs"
  - "**/examples/**"
  - "fuzz/**"
  - "contrib/**"
