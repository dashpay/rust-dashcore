description: "Many slow peers: 8 peers @ 300ms/30ms jitter, 8 Mbit each, full 1M sync. Stresses per-peer cap growth — saturating a high-latency rate-capped link needs several in-flight requests per peer, so caps must climb well above the floor."
mode: local
cpus: "0-5"
max_peers: 8
repeats: 2
blocks: 1000000
peers:
  - count: 8
    latency_ms: 300
    jitter_ms: 30
    rate_kbit: 8000

# The client's own link, uniform across every local scenario so the only thing
# that varies between them is what the peers do. 150 Mbit with 5ms one-way
# (~10ms RTT) is a nearby, unremarkable connection — enough headroom that the
# client is not the bottleneck, but not the infinite loopback pipe an unshaped
# host run gives, which flatters the client in a way no real deployment does.
client:
  latency_ms: 5
  rate_kbit: 150000
