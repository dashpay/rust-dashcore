[package]
name = "dash-spv-bench"
edition = "2021"
publish = false
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
dash-spv = { workspace = true }
dashcore = { workspace = true, features = [
    "serde",
    "core-block-hash-use-x11",
    "message_verification",
    "bls",
    "quorum_validation",
] }
key-wallet = { workspace = true }
key-wallet-manager = { workspace = true }

tokio = { workspace = true, features = ["full"] }

anyhow = { workspace = true }
tempfile = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
indicatif = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
pprof = { version = "0.14", features = ["flamegraph"], optional = true }
tikv-jemallocator = { version = "0.7", features = [
    "profiling",
], optional = true }
jemalloc_pprof = { version = "0.9", features = [
    "flamegraph",
    "symbolize",
], optional = true }

[features]
cpu-profile = ["dep:pprof"]
heap-profile = ["dep:tikv-jemallocator", "dep:jemalloc_pprof"]

[[bin]]
name = "dash-spv-bench"
path = "src/main.rs"

[lints]
workspace = true
