[package]
name = "dash-spv-bench"
edition = "2021"
publish = false
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
dash-spv = { path = "../dash-spv" }
dashcore = { path = "../dash", features = ["serde", "core-block-hash-use-x11", "message_verification", "bls", "quorum_validation"] }
key-wallet = { path = "../key-wallet" }
key-wallet-manager = { path = "../key-wallet-manager" }

tokio = { workspace = true, features = ["full"] }

anyhow = { workspace = true }
tempfile = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
indicatif = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
pprof = { version = "0.14", features = ["flamegraph"], optional = true }
tikv-jemallocator = { version = "0.7", features = ["profiling"], optional = true }
jemalloc_pprof = { version = "0.9", features = ["flamegraph", "symbolize"], optional = true }

[features]
cpu-profile = ["dep:pprof"]
heap-profile = ["dep:tikv-jemallocator", "dep:jemalloc_pprof"]

[[bin]]
name = "dash-spv-bench"
path = "src/main.rs"
