[package]
name = "dash-spv-bench"
version = { workspace = true }
edition = "2021"
license = "MIT"
publish = false

[dependencies]
dash-spv = { path = "../dash-spv" }
dashcore = { path = "../dash", features = ["serde", "core-block-hash-use-x11", "message_verification", "bls", "quorum_validation"] }
key-wallet = { path = "../key-wallet" }
key-wallet-manager = { path = "../key-wallet-manager", features = ["parallel-filters"] }

tokio = { version = "1.0", features = ["full"] }

anyhow = "1.0"
tempfile = "3.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
indicatif = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
pprof = { version = "0.14", features = ["flamegraph"], optional = true }
tikv-jemallocator = { version = "0.7", features = ["profiling"], optional = true }
jemalloc_pprof = { version = "0.9", features = ["flamegraph", "symbolize"], optional = true }

[features]
cpu-profile = ["dep:pprof"]
heap-profile = ["dep:tikv-jemallocator", "dep:jemalloc_pprof"]

[[bin]]
name = "dash-spv-bench"
path = "src/main.rs"
