[package]
name = "masternode-seeds-fetcher"
description = "Fetch the current masternode IP list from the Dash P2P network and write per-network seed files used by dash-spv."
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "masternode-seeds-fetcher"
path = "src/main.rs"

[dependencies]
dashcore = { workspace = true, features = ["core-block-hash-use-x11", "tokio"] }
dash-network-seeds = { workspace = true }

tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }

clap = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
rand = { workspace = true }
futures = { workspace = true }

# TLS probing for the Dash Platform HTTP port (Evo nodes).
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
x509-parser = "0.18"

[lints]
workspace = true
