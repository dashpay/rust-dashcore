[package]
name = "dashcore-rpc"
authors = [
    "Steven Roose <steven@stevenroose.org>",
    "Jean Pierre Dudey <jeandudey@hotmail.com>",
    "Dawid Ciężarkiewicz <dpc@dpc.pw>",
]
description = "RPC client library for the Dash Core JSON-RPC API."
keywords = ["crypto", "dash", "dash-core", "rpc"]
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "dashcore_rpc"
path = "src/lib.rs"

[dependencies]
dashcore = { workspace = true, optional = true }
dashcore-rpc-json = { workspace = true }
hex-conservative = { workspace = true }

jsonrpc = "0.21.0"
tracing = { workspace = true }

# Used for deserialization of JSON.
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["net", "process", "time"] }

[features]
test-utils = ["dep:dashcore", "dashcore/test-utils", "dep:tempfile", "dep:tokio"]

[dev-dependencies]
dashcore-rpc = { workspace = true, features = ["test-utils"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
test-case = { workspace = true }

[lints]
workspace = true
