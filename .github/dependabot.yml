version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let fresh releases settle before they reach CI.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # Its refs are toolchain branches, not action versions.
      - dependency-name: dtolnay/rust-toolchain
