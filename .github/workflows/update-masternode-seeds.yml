name: Update masternode seeds

# Refreshes the hardcoded masternode IP lists shipped in dash-spv/seeds/ by
# calling `masternode list json` against live mainnet/testnet dashd RPC nodes
# and opening a pull request if the resulting files change.
#
# Required repository secrets:
#   MAINNET_DASHD_RPC_URL, MAINNET_DASHD_RPC_USER, MAINNET_DASHD_RPC_PASS
#   TESTNET_DASHD_RPC_URL, TESTNET_DASHD_RPC_USER, TESTNET_DASHD_RPC_PASS
#
# Missing secrets for a given network cause that network to be skipped with a
# warning; they do not fail the run. This lets the workflow be enabled
# incrementally.

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh masternode seed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "masternode-seeds-fetcher"

      - name: Build fetcher
        run: cargo build --release -p masternode-seeds-fetcher

      - name: Refresh mainnet seeds
        env:
          DASHD_RPC_URL: ${{ secrets.MAINNET_DASHD_RPC_URL }}
          DASHD_RPC_USER: ${{ secrets.MAINNET_DASHD_RPC_USER }}
          DASHD_RPC_PASS: ${{ secrets.MAINNET_DASHD_RPC_PASS }}
        run: |
          if [ -z "$DASHD_RPC_URL" ] || [ -z "$DASHD_RPC_USER" ] || [ -z "$DASHD_RPC_PASS" ]; then
            echo "::warning::Mainnet RPC secrets not configured; skipping mainnet refresh."
            exit 0
          fi
          ./target/release/masternode-seeds-fetcher \
            --network mainnet \
            --out dash-spv/seeds/mainnet.txt

      - name: Refresh testnet seeds
        env:
          DASHD_RPC_URL: ${{ secrets.TESTNET_DASHD_RPC_URL }}
          DASHD_RPC_USER: ${{ secrets.TESTNET_DASHD_RPC_USER }}
          DASHD_RPC_PASS: ${{ secrets.TESTNET_DASHD_RPC_PASS }}
        run: |
          if [ -z "$DASHD_RPC_URL" ] || [ -z "$DASHD_RPC_USER" ] || [ -z "$DASHD_RPC_PASS" ]; then
            echo "::warning::Testnet RPC secrets not configured; skipping testnet refresh."
            exit 0
          fi
          ./target/release/masternode-seeds-fetcher \
            --network testnet \
            --out dash-spv/seeds/testnet.txt

      - name: Verify parsed seed files still build
        run: cargo check -p dash-spv --tests

      - name: Open pull request on change
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(dash-spv): refresh masternode seed files"
          title: "chore(dash-spv): refresh masternode seed files"
          body: |
            Weekly automated refresh of the hardcoded masternode IP lists
            embedded in `dash-spv` (`dash-spv/seeds/mainnet.txt`,
            `dash-spv/seeds/testnet.txt`).

            Generated by `.github/workflows/update-masternode-seeds.yml`
            via the `masternode-seeds-fetcher` crate against the configured
            dashd RPC nodes.

            If only one network changed, the other network's secrets are
            either unset or its list was unchanged since last run.
          branch: chore/refresh-masternode-seeds
          delete-branch: true
          add-paths: |
            dash-spv/seeds/mainnet.txt
            dash-spv/seeds/testnet.txt
          labels: automated
