name: Draft Gate

# Decides whether CI runs. A draft PR runs it only when its run is restarted, which is how
# `draft-ci.yml` starts it, or when the "Run CI on every push" box of its CI comment is ticked.
# Every other event runs it.

on:
  workflow_call:
    outputs:
      run:
        description: Whether the calling workflow runs its jobs
        value: ${{ jobs.check.outputs.run }}

permissions: {}

jobs:
  check:
    name: check
    runs-on: ${{ vars.DASH_LIGHT_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    env:
      # A restarted run keeps its first event payload, so the attempt is the only sign of a request.
      ASK: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && github.run_attempt == '1' }}
    steps:
      # The runner is shared with jobs that hold a write token, so it runs the default branch's
      # script, never a copy the PR changed.
      - uses: actions/checkout@v7.0.1
        if: env.ASK == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Decide whether CI runs
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$ASK" = true ]; then
            python3 .github/scripts/draft_ci.py gate "$PR_NUMBER"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
