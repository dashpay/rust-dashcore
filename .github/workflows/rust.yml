on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

name: Continuous integration

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft-gate:
    name: Draft Gate
    permissions:
      pull-requests: read
    uses: $/.github/workflows/draft-gate.yml

  security:
    name: Security Audit
    needs: draft-gate
    if: needs.draft-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2.1.2

  msrv:
    name: MSRV Check
    needs: draft-gate
    if: needs.draft-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: just
      - name: Check workspace compiles on MSRV
        run: just msrv

  docs:
    name: Documentation
    needs: draft-gate
    if: needs.draft-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: just
      - name: Build documentation
        run: just doc

  verify-groups:
    name: Verify Test Groups
    needs: draft-gate
    if: needs.draft-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: just
      - run: pip install pyyaml
      - name: Verify group config and hardcoded matrix
        run: just gha::verify-groups

  test-scripts:
    name: Test Workflow Scripts
    needs: draft-gate
    if: needs.draft-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: just
      - name: Test the workflow scripts
        run: just gha::test-scripts

  verify-actions-lock:
    name: Verify Action Lockfile
    needs: draft-gate
    if: needs.draft-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: just
      - name: Verify the action lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: just gha::setup gha::verify

  test-ubuntu:
    name: Ubuntu
    needs: draft-gate
    if: needs.draft-gate.outputs.run == 'true'
    uses: $/.github/workflows/build-and-test.yml
    with:
      os: ubuntu-latest
      coverage: true
    secrets: inherit

  test-ubuntu-arm:
    name: Ubuntu ARM
    needs: draft-gate
    if: needs.draft-gate.outputs.run == 'true'
    uses: $/.github/workflows/build-and-test.yml
    with:
      os: ubuntu-22.04-arm

  test-macos:
    name: macOS
    needs: draft-gate
    if: needs.draft-gate.outputs.run == 'true'
    uses: $/.github/workflows/build-and-test.yml
    with:
      os: macos-latest

  test-windows:
    name: Windows
    needs: draft-gate
    if: needs.draft-gate.outputs.run == 'true'
    uses: $/.github/workflows/build-and-test.yml
    with:
      os: windows-latest
