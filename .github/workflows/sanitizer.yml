name: Sanitizer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    paths:
      - 'dash/**'
      - 'hashes/**'
      - 'crypto/**'
      - 'internals/**'
      - 'dash-network/**'
      - 'key-wallet/**'
      - 'key-wallet-manager/**'
      - 'dash-spv/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/sanitizer.yml'
      - 'Justfile'
      - 'mod.just'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan:
    name: Address Sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: taiki-e/install-action@v2.89.1
        with:
          tool: just

      - name: Run tests with ASAN
        run: just asan

  tsan:
    name: Thread Sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: taiki-e/install-action@v2.89.1
        with:
          tool: just

      - name: Run tests with TSAN
        run: just tsan
