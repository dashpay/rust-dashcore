name: Sanitizer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'dash/**'
      - 'hashes/**'
      - 'crypto/**'
      - 'internals/**'
      - 'dash-network/**'
      - 'key-wallet/**'
      - 'key-wallet-manager/**'
      - 'dash-spv/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/sanitizer.yml'
      - 'Justfile'
      - 'mod.just'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft-gate:
    name: Draft Gate
    permissions:
      pull-requests: read
    uses: $/.github/workflows/draft-gate.yml

  asan:
    name: Address Sanitizer
    needs: draft-gate
    if: needs.draft-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal --component rust-src --no-self-update

      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: just

      - name: Run tests with ASAN
        run: just asan

  tsan:
    name: Thread Sanitizer
    needs: draft-gate
    if: needs.draft-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal --component rust-src --no-self-update

      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: just

      - name: Run tests with TSAN
        run: just tsan
