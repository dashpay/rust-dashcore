name: Sanitizer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    paths:
      - 'dash/**'
      - 'hashes/**'
      - 'crypto/**'
      - 'internals/**'
      - 'dash-network/**'
      - 'key-wallet/**'
      - 'key-wallet-manager/**'
      - 'dash-spv/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/sanitizer.yml'
      - 'Justfile'
      - 'mod.just'

permissions:
  contents: read

env:
  NIGHTLY_TOOLCHAIN: nightly-2026-11-20

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan:
    name: Address Sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install nightly toolchain
        run: rustup toolchain install "$NIGHTLY_TOOLCHAIN" --profile minimal --component rust-src --no-self-update

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ env.NIGHTLY_TOOLCHAIN }}
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: just

      - name: Run tests with ASAN
        run: just asan

  tsan:
    name: Thread Sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install nightly toolchain
        run: rustup toolchain install "$NIGHTLY_TOOLCHAIN" --profile minimal --component rust-src --no-self-update

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ env.NIGHTLY_TOOLCHAIN }}
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: just

      - name: Run tests with TSAN
        run: just tsan
