name: Build and Test

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      coverage:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Keep these defaults in sync with contrib/setup-dashd.py
env:
  DASHVERSION: "23.1.0"
  TEST_DATA_REPO: "dashpay/regtest-blockchain"
  TEST_DATA_VERSION: "v0.0.4"

jobs:
  test:
    name: ${{ matrix.group }}
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        group: ["core", "spv", "wallet", "rpc"]
    env:
      RUST_BACKTRACE: 1
      CACHE_DIR: ${{ github.workspace }}/.rust-dashcore-test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: "test-${{ inputs.os }}-${{ matrix.group }}"
          prefix-key: "v1-rust"
          cache-bin: false
      - uses: taiki-e/install-action@v2.90.0
        with:
          tool: just

      - name: Install cargo-llvm-cov
        if: inputs.coverage
        uses: taiki-e/install-action@v2.90.0
        with:
          tool: cargo-llvm-cov

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      # Set up dashd and test data for groups that need it
      - name: Cache dashd and test data
        if: matrix.group == 'spv'
        uses: actions/cache@v6.1.0
        with:
          path: .rust-dashcore-test
          key: rust-dashcore-test-${{ inputs.os }}-${{ env.DASHVERSION }}-${{ env.TEST_DATA_REPO }}-${{ env.TEST_DATA_VERSION }}

      - name: Run tests
        id: tests
        env:
          CI_OS: ${{ inputs.os }}
          DASHD_TEST_RETAIN_DIR: ${{ matrix.group == 'spv' && format('{0}/dashd-test-logs', runner.temp) || '' }}
        run: just ${{ inputs.coverage && 'coverage' || 'test' }} ${{ matrix.group }}

      - name: Generate coverage report
        if: inputs.coverage && steps.tests.outputs.crate_flags
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: inputs.coverage && steps.tests.outputs.crate_flags
        uses: codecov/codecov-action@v7.1.1
        with:
          files: lcov.info
          flags: ${{ steps.tests.outputs.crate_flags }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Upload failed dashd test logs
        if: failure() && matrix.group == 'spv'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.group }}-test-logs-${{ inputs.os }}
          path: ${{ runner.temp }}/dashd-test-logs/
          retention-days: 7
          if-no-files-found: ignore
