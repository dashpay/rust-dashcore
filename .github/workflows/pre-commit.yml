name: Pre-commit Checks

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      os:
        description: JSON list of runner OSes
        required: true
        type: string

# The event keeps a manual nightly run from cancelling the scheduled one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft-gate:
    name: Draft Gate
    permissions:
      pull-requests: read
    uses: $/.github/workflows/draft-gate.yml

  pre-commit:
    name: Pre-commit (${{ matrix.os }})
    needs: draft-gate
    if: needs.draft-gate.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests and pushes check Ubuntu only. pre-commit-nightly.yml covers macOS and Windows.
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: "pre-commit-rust-${{ matrix.os }}"
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --hook-stage push --verbose
