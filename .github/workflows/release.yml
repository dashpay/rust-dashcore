name: Release

# Publishes the release a merged release PR puts on `master`: tags the workspace version, creates
# the GitHub release from its changelog section and opens the PR that bumps `dev` to the next
# version. Each step skips what already exists, so a failed run can be rerun.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Tag and release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read the workspace version
        id: version
        run: echo "version=$(python3 .github/scripts/release.py version)" >> "$GITHUB_OUTPUT"

      - name: Tag the release
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "The v$VERSION release already exists"
            exit 0
          fi
          python3 .github/scripts/release.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest

  bump:
    name: Open the version bump PR
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: dev

      - name: Bump the version
        id: bump
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          git fetch --depth=1 origin "$GITHUB_SHA"
          git show FETCH_HEAD:CHANGELOG.md > "$RUNNER_TEMP/CHANGELOG.md"
          python3 .github/scripts/release.py bump "$VERSION" --released-changelog "$RUNNER_TEMP/CHANGELOG.md"

      - name: Open the pull request
        if: steps.bump.outputs.version
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          # PRs opened with `github.token` start no workflows. A token from the secret lets CI run.
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          base: dev
          branch: chore/bump-version-to-${{ steps.bump.outputs.version }}
          commit-message: "chore: bump version to `${{ steps.bump.outputs.version }}`"
          title: "chore: bump version to `${{ steps.bump.outputs.version }}`"
          body: |
            Starts the `${{ steps.bump.outputs.version }}` development cycle on `dev` now that [`v${{ needs.publish.outputs.version }}`](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.publish.outputs.version }}) is released from `master`.

            - Bump the workspace version to `${{ steps.bump.outputs.version }}`.
            - Add the `${{ needs.publish.outputs.version }}` changelog section, identical to the one on `master`.

            Opened by `.github/workflows/release.yml`.
          labels: release
          add-paths: |
            Cargo.toml
            CHANGELOG.md
