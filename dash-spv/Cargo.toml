[package]
name = "dash-spv"
description = "Dash SPV (Simplified Payment Verification) client library"
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
# Core Dash libraries
dashcore = { workspace = true, features = [
    "serde",
    "core-block-hash-use-x11",
    "message_verification",
    "bls",
    "quorum_validation",
    "tokio",
] }
dashcore_hashes = { workspace = true }
dash-network-seeds = { workspace = true }
key-wallet = { workspace = true }
key-wallet-manager = { workspace = true }
git-state = { workspace = true }

# BIP324 v2 P2P encrypted transport
bip324 = { workspace = true, features = ["tokio"] }

# CLI
clap = { workspace = true, optional = true }

# Async runtime
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }
tokio-util = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = { workspace = true }
futures = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Serialization
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
], optional = true }
tracing-appender = { version = "0.2", optional = true }
chrono = { workspace = true, features = ["default"], optional = true }

# Utilities
rand = { workspace = true }
hex-conservative = { workspace = true }

# Parallelization

# Masternode engine snapshots
bincode = { workspace = true }

# Test utilities (optional)
tempfile = { workspace = true, optional = true }
dashcore-rpc = { workspace = true, optional = true }

[build-dependencies]
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }

[dev-dependencies]
dash-pkc = { workspace = true, features = ["bls", "portable"] }
dash-spv = { workspace = true, features = ["test-utils"] }
dashcore = { workspace = true, features = ["test-utils"] }
key-wallet = { workspace = true, features = ["test-utils"] }
key-wallet-manager = { workspace = true, features = ["test-utils"] }
criterion = { workspace = true, features = ["async_tokio"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
test-case = { workspace = true }

[[bench]]
name = "storage"
harness = false

[[bin]]
name = "dash-spv"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "generate-checkpoints"
path = "src/bin/generate_checkpoints.rs"
required-features = ["cli"]

[[example]]
name = "simple_sync"
required-features = ["logging"]

[[example]]
name = "filter_sync"
required-features = ["logging"]

[[example]]
name = "spv_with_wallet"
required-features = ["logging"]

[lib]
name = "dash_spv"
path = "src/lib.rs"

[features]
cli = ["logging", "dep:clap", "tokio/rt-multi-thread", "tokio/signal"]
logging = ["dep:chrono", "dep:tracing-appender", "dep:tracing-subscriber"]
test-utils = [
    "logging",
    "tokio/process",
    "dashcore/test-utils",
    "key-wallet-manager/test-utils",
    "dep:tempfile",
    "dep:dashcore-rpc",
]

[lints]
workspace = true
