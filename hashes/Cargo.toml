[package]
name = "dashcore_hashes"
description = "Hash functions used by the rust-dash eccosystem"
authors = ["Samuel Westrich <sam@dash.org>"]
edition = "2021"
categories = ["algorithms"]
keywords = [ "crypto", "dash", "hash", "digest" ]
readme = "README.md"
exclude = ["tests", "contrib"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
schemars = ["actual-schemars"]
serde-std = ["serde/std"]
x11 = ["rs-x11-hash"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Do NOT use this as a feature! Use the `schemars` feature instead. Can only be used with "std" enabled.
actual-schemars = { package = "schemars", version = "1.0", optional = true }
bincode = { workspace = true, optional = true }
internals = { path = "../internals", package = "dashcore-private" }
rs-x11-hash = { version = "0.1.8", optional = true }
serde = { version = "1.0.219", default-features = false, optional = true }

[dev-dependencies]
serde_test = "1.0"
criterion = "0.5"
test-case = "3.3"

[target.wasm32-unknown-unknown.dev-dependencies]
wasm-bindgen-test = "0.3"

[[bench]]
name = "hashes"
harness = false

[[bench]]
name = "siphash"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(bench)', 'cfg(fuzzing)'] }
