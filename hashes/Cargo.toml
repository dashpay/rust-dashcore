[package]
name = "dashcore_hashes"
description = "Hash functions used by the rust-dash eccosystem"
authors = ["Samuel Westrich <sam@dash.org>"]
edition = "2021"
categories = ["algorithms"]
keywords = [ "crypto", "dash", "hash", "digest" ]
readme = "README.md"
exclude = ["tests", "contrib"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
serde = ["dep:serde", "bitcoin_hashes/serde"]
serde-std = ["serde", "serde/std"]
x11 = ["dep:dash-pow"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bincode = { workspace = true, optional = true }
bitcoin_hashes = { workspace = true, features = ["std"] }
hex-conservative = { workspace = true }
serde = { workspace = true, optional = true }

# `dash-pow` supports hardware acceleration on platforms that meet system requirements. All other platforms must use `portable`.
dash-pow = { workspace = true, optional = true }

[target.'cfg(all(target_arch = "aarch64", not(all(target_feature = "neon", target_feature = "aes"))))'.dependencies]
dash-pow = { workspace = true, optional = true, features = ["portable"] }

[target.'cfg(all(target_arch = "x86_64", not(all(target_feature = "aes", target_feature = "avx", target_feature = "avx2", target_feature = "bmi1", target_feature = "bmi2", target_feature = "f16c", target_feature = "fma", target_feature = "lzcnt", target_feature = "movbe", target_feature = "xsave"))))'.dependencies]
dash-pow = { workspace = true, optional = true, features = ["portable"] }

[target.'cfg(all(target_arch = "wasm32", not(target_feature = "simd128")))'.dependencies]
dash-pow = { workspace = true, optional = true, features = ["portable"] }

[target.'cfg(not(any(target_arch = "aarch64", target_arch = "x86_64", target_arch = "wasm32")))'.dependencies]
dash-pow = { workspace = true, optional = true, features = ["portable"] }

[dev-dependencies]
serde_test = "1.0"
criterion = "0.5"
test-case = "3.3"

[target.wasm32-unknown-unknown.dev-dependencies]
wasm-bindgen-test = "0.3"

[[bench]]
name = "hashes"
harness = false

[[bench]]
name = "siphash"
harness = false

[[bench]]
name = "x11"
harness = false
required-features = ["x11"]

[lints.rust]
unnameable_types = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(bench)', 'cfg(fuzzing)'] }
