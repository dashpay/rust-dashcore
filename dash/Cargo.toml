[package]
name = "dashcore"
authors = [
    "Samuel Westrich <sam@dash.org>",
    "Anton Suprunchuk <anton@dash.org>",
    "Dmitrii Golubev <dmitrii.golubev@dash.org>",
]
description = "General purpose library for using and interoperating with Dash Core payment chain."
categories = ["cryptography::cryptocurrencies"]
keywords = ["crypto", "dash"]
readme = "../README.md"
exclude = ["tests", "contrib"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# Please don't forget to add relevant features to docs.rs below
[features]
default = ["bincode"]
base64 = ["dep:base64"]
rand-std = ["rand"]
rand = ["dashcore-crypto/rand"]
serde = [
    "dep:serde",
    "bitcoin-units/serde",
    "dashcore-crypto/serde",
    "dashcore_hashes/serde",
    "dash-network/serde",
    "dash-types/serde",
]
signer = ["rand", "base64"]
core-block-hash-use-x11 = ["dashcore_hashes/x11"]
bls = ["dashcore-crypto/bls"]
eddsa = ["dashcore-crypto/eddsa"]
quorum_validation = ["bls"]
message_verification = ["bls"]
bincode = [
    "dep:bincode",
    "dashcore-crypto/bincode",
    "dashcore_hashes/bincode",
    "dash-network/bincode",
]
test-utils = []
tokio = ["dep:tokio-util", "dep:bytes"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
internals = { workspace = true }
bitcoin-units = { workspace = true, features = ["std"] }
dashcore_hashes = { workspace = true }
dashcore-crypto = { workspace = true }
dash-network = { workspace = true }
dash-num = { workspace = true }
dash-params = { workspace = true }
dash-types = { workspace = true }
serde = { workspace = true, features = [
    "derive",
    "alloc",
    "rc",
], optional = true }

base64 = { version = "0.22", optional = true }
bitcoinconsensus = { version = "0.20.2-0.5.0", default-features = false, optional = true }
anyhow = { workspace = true }
hex-conservative = { workspace = true }
bincode = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["codec"], optional = true }
bytes = { version = "1", optional = true }
blake3 = "1.8.1"
thiserror = { workspace = true }
bitvec = "1.0"
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
serde_test = { workspace = true }
serde_derive = "1.0.219"
dashcore-crypto = { workspace = true, features = ["rand"] }
bincode = { workspace = true, features = ["serde"] }
assert_matches = "1.5.0"
test-case = { workspace = true }
dashcore = { workspace = true, features = [
    "core-block-hash-use-x11",
    "message_verification",
    "quorum_validation",
    "signer",
] }
criterion = { workspace = true }

[[example]]
name = "handshake"

[[bench]]
name = "transaction"
harness = false

[lints]
workspace = true
